services:
  tor:
    image: oniondock
    build:
      context: ../tor
    environment:
      - SECURITY_LEVEL=high
      - TOR_SERVICE_PORTS=80:webapp:80
      - TOR_TRANSPORT_TYPE=snowflake
    volumes:
      - ./data/tor/hidden_service:/var/lib/tor/hidden_service:rw
    restart: unless-stopped
    networks:
      - onion_network
    depends_on:
      - webapp

  webapp:
    build:
      context: ./app
    networks:
      - onion_network
    restart: unless-stopped

networks:
  onion_network:
    driver: bridge
