<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>OnionDock Example</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #121212;
                --fg: #e0e0e0;
                --mute: #ababab;
                --accent: #b76fd1;
                --card: #1e1e1e;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 2rem;
                font:
                    1rem/1.5 system-ui,
                    sans-serif;
                background: var(--bg);
                color: var(--fg);
            }
            main {
                max-width: 36rem;
                text-align: center;
            }
            h1 {
                color: var(--accent);
                margin: 0 0 1rem;
            }
            p {
                color: var(--mute);
                margin: 0 0 0.75rem;
            }
            a {
                color: var(--accent);
            }
            code {
                display: block;
                margin-top: 1.5rem;
                padding: 0.75rem 1rem;
                background: var(--card);
                border-radius: 0.5rem;
                font-family: ui-monospace, monospace;
                text-align: left;
                overflow-x: auto;
            }
            svg {
                width: 5rem;
                height: 5rem;
                margin-bottom: 1.5rem;
            }
        </style>
    </head>
    <body>
        <main>
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="256" cy="256" r="256" fill="#9b59b6" />
                <path
                    fill="#fff"
                    d="M256.5 465.4v-31a178.4 178.4 0 0 0 0-356.8v-31a209.4 209.4 0 0 1 0 418.8z"
                />
                <path
                    fill="#fff"
                    d="M256.5 356.8a100.8 100.8 0 0 0 0-201.6v-31a131.8 131.8 0 0 1 0 263.6z"
                />
                <path fill="#fff" d="M256.5 201.7a54.3 54.3 0 0 1 0 108.6z" />
            </svg>
            <h1>Hello, Tor!</h1>
            <p>This page is served as a Tor v3 hidden service via OnionDock.</p>
            <p>Source: <a href="https://github.com/tn3w/OnionDock">github.com/tn3w/OnionDock</a></p>
            <code>docker compose exec tor cat /var/lib/tor/hidden_service/hostname</code>
        </main>
    </body>
</html>
